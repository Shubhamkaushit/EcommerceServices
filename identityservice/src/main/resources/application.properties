spring.application.name=identityservice
server.port=8085

spring.datasource.url=jdbc:mysql://localhost:3306/customerservice
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Keycloak Admin Credentials
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli

# Keycloak URLs
keycloak.server-url=http://localhost:8181
keycloak.realm=ecommerce

# User Login URL
keycloak.token-url=http://localhost:8181/realms/ecommerce/protocol/openid-connect/token
keycloak.admin-token-url=http://localhost:8181/realms/master/protocol/openid-connect/token
keycloak.create-user-url=http://localhost:8181/admin/realms/ecommerce/users