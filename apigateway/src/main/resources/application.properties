spring.application.name=apigateway
server.port=8080
spring.main.web-application-type=reactive

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

management.endpoints.web.exposure.include=*

logging.level.root=INFO
logging.level.org.springframework.cloud.gateway=TRACE

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8181/realms/ecommerce

# Identity Service
spring.cloud.gateway.server.webflux.routes[0].id=identityservice
spring.cloud.gateway.server.webflux.routes[0].uri=lb://identityservice
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/identity/**

# Product Service
spring.cloud.gateway.server.webflux.routes[1].id=productservice
spring.cloud.gateway.server.webflux.routes[1].uri=lb://productservice
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/product,/product/**

# Order Service
spring.cloud.gateway.server.webflux.routes[2].id=orderservice
spring.cloud.gateway.server.webflux.routes[2].uri=lb://orderservice
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/order,/order/**

# Inventory Service
spring.cloud.gateway.server.webflux.routes[3].id=inventoryservice
spring.cloud.gateway.server.webflux.routes[3].uri=lb://inventoryservice
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/inventory,/inventory/**

# Eureka dashboard (HTML page)
spring.cloud.gateway.server.webflux.routes[4].id=discoveryserver
spring.cloud.gateway.server.webflux.routes[4].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/eureka/web
spring.cloud.gateway.server.webflux.routes[4].filters[0]=SetPath=/

# Eureka static resources (css/js)
spring.cloud.gateway.server.webflux.routes[5].id=discoveryserver-static
spring.cloud.gateway.server.webflux.routes[5].uri=http://localhost:8761
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/eureka/**